<!DOCTYPE html>
<html>

<head>
    <title>Handwritten Character Classifier</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
</head>

<body>
    <h1>Character Classifier</h1>

    <canvas id="canvas" width="360" height="360"></canvas>

    <br>

    <button id="clearCanvas-button">Clear</button>
    <button id="predict-button">Submit</button>

    <div id="prediction">Draw something and click Submit</div>

    <br>

    <div id="feedback" hidden>
        <button id="correct-button">Correct</button>
        <button id="confirmCorrect-button" hidden>Confirm?</button>
        <button id="incorrect-button">Incorrect</button>
    </div>

    <div id="incorrect" hidden>
        <label>Enter the correct character: </label>
        <input id="char" type="text" maxlength="1" placeholder="^[0-9A-Za-z]$">
        <button id="submitFeedback-button">Confirm</button>
        <button id="cancel-button">Cancel</button>
    </div>


    <div id="submitted" hidden>Feedback submitted!</div>

    <script type="module" src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>

</html>
